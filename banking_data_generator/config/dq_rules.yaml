# ==========================================================
# Enterprise Banking Data Quality Rules
# ==========================================================

enabled: true

null_values:

  customer_email: 1

  customer_phone: 0.5

  nominee_name: 5

duplicate_records:

  customer: 0.05

  account: 0.02

invalid_formats:

  pan_number: 0.5

  aadhaar_number: 0.2

  ifsc_code: 0.2

business_rule_violations:

  future_date_of_birth: 0.05

  negative_account_balance: 0.1

  invalid_interest_rate: 0.05

consistency:

  orphan_accounts: 0

  orphan_transactions: 0

uniqueness:

  duplicate_pan: 0.05

  duplicate_account_number: 0

accuracy:

  incorrect_customer_age: 0.1

timeliness:

  delayed_transactions: 1